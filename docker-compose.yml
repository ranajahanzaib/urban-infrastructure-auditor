services:
  db:
    build:
      context: .
      dockerfile: infrastructure/docker/postgres/Dockerfile
    container_name: uia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urban_infrastructure}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban_infrastructure"]
      interval: 10s
      timeout: 5s
      retries: 5

  vision:
    build:
      context: .
      dockerfile: infrastructure/docker/vision/Dockerfile
    container_name: uia-vision
    restart: unless-stopped
    environment:
      PORT: 8001
      DEVICE: ${VISION_DEVICE:-cpu}
      SIGLIP_MODEL_ID: ${SIGLIP_MODEL_ID:-google/siglip-base-patch16-224}
      DINOV2_MODEL_ID: ${DINOV2_MODEL_ID:-facebook/dinov2-base}
    ports:
      - "${VISION_PORT:-8001}:8001"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./data/storage:/app/data/storage:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: uia-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      vision:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-urban_infrastructure}?sslmode=disable
      VISION_SERVICE_URL: http://vision:8001
      STORAGE_DIR: /app/data/storage
      ENVIRONMENT: production
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data/storage:/app/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    container_name: uia-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  hf_cache:
